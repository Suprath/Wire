name: Project Wire CI/CD Multi-Platform Native Build & Release

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: wire-linux-x86_64.tar.gz
            asset_name: wire-linux-x86_64.tar.gz
          - os: windows-latest
            artifact_name: wire-windows-x64.zip
            asset_name: wire-windows-x64.zip
          - os: macos-latest
            artifact_name: wire-macos-arm64.tar.gz
            asset_name: wire-macos-arm64.tar.gz

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # GitHub-hosted runners ship with CMake 3.25+ and Ninja pre-installed.
      # Use Ninja on all platforms — avoids Visual Studio generator detection issues.
      - name: Verify CMake + Ninja
        run: |
          cmake --version
          ninja --version

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja

      - name: Build Executables
        run: cmake --build build --config Release --parallel

      # RealSocketTransportTest requires two live UDP peers — skip it in CI.
      # All other 16 suites run normally.
      - name: Run CTest Suite
        run: ctest --test-dir build --output-on-failure --exclude-regex RealSocketTransportTest

      # ── Packaging ─────────────────────────────────────────────────────────

      - name: Package Windows Binary Artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item build/wire_tui.exe dist/
          Copy-Item build/wire_tui_interactive.exe dist/
          Compress-Archive -Path dist/* -DestinationPath wire-windows-x64.zip

      - name: Package Linux Binary Artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp build/wire_tui dist/wire_tui
          cp build/wire_tui_interactive dist/wire_tui_interactive
          tar -czvf wire-linux-x86_64.tar.gz -C dist .

      - name: Package macOS Binary Artifacts
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp build/wire_tui dist/wire_tui
          cp build/wire_tui_interactive dist/wire_tui_interactive
          tar -czvf wire-macos-arm64.tar.gz -C dist .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: wire-linux-x86_64.tar.gz
          path: ./release-assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: wire-windows-x64.zip
          path: ./release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: wire-macos-arm64.tar.gz
          path: ./release-assets

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/*
          name: Project Wire ${{ github.ref_name }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          draft: false
          prerelease: false
          body: |
            ## 🔐 Project Wire — Native Multi-Platform Release

            Automatically compiled and verified via GitHub Actions CI/CD:

            | Platform | Download | Contents |
            |----------|----------|----------|
            | **Windows x64** | `wire-windows-x64.zip` | `wire_tui.exe`, `wire_tui_interactive.exe` |
            | **macOS ARM64** | `wire-macos-arm64.tar.gz` | `wire_tui`, `wire_tui_interactive` |
            | **Linux x86_64** | `wire-linux-x86_64.tar.gz` | `wire_tui`, `wire_tui_interactive` |

            ### ✅ Verified
            All 16 automated CTest suites passed on every platform.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
